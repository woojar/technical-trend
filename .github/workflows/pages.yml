name: Pages

on:
  # Manual commits to digests/ (or changes to the generator) publish directly.
  push:
    branches: [main]
    paths:
      - "digests/**"
      - "src/trend/site.py"
      - ".github/workflows/pages.yml"

  # The weekly job's own commit does NOT raise a push event: GitHub suppresses
  # triggers for pushes authenticated with the default GITHUB_TOKEN so that a
  # workflow cannot retrigger itself. Without this hook the site would silently
  # stop updating after the first deploy.
  workflow_run:
    workflows: ["Weekly digest"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

# Required by actions/deploy-pages: it mints an OIDC token rather than using a
# long-lived secret.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Do not publish off a failed digest run.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # For a workflow_run event the default checkout ref is the commit that
      # started the triggering run, which predates the digest it committed.
      # Ask for the branch tip explicitly so the new issue is included.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The site generator needs the docs group; nothing else here does.
      - name: Install dependencies
        run: uv sync --frozen --group docs

      - uses: actions/configure-pages@v5
        id: pages

      # base_url comes from configure-pages so feed.xml gets absolute links
      # without the URL being hardcoded anywhere.
      - name: Build site
        run: uv run trend site --out site --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
