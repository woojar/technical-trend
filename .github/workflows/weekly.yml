name: Weekly digest

on:
  schedule:
    # Mondays 01:00 UTC. GitHub queues cron jobs under load, and in practice
    # this one has started 5-8 hours late. Scheduled at 06:00 that put the LLM
    # calls in US morning, Gemini's busiest window, where the free tier answers
    # "503 high demand". Starting earlier keeps even a late run clear of it.
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the digest but do not commit it"
        type: boolean
        default: false

# Needed to push the generated digest back to the repository.
permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen fails if uv.lock is stale rather than silently resolving
      # something new, which is what you want for an unattended job.
      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # state.db records which stories were already published. Restoring it
      # keeps a story that stays popular for two weeks out of two digests.
      - name: Restore seen-item state
        uses: actions/cache/restore@v4
        with:
          path: state.db
          key: trend-state-${{ github.run_id }}
          restore-keys: trend-state-

      - name: Generate digest
        id: digest
        env:
          # Set whichever you have in Settings > Secrets and variables > Actions.
          # Missing keys are skipped; with none set the digest still builds from
          # headlines and excerpts.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # Automatic token; raises the GitHub Search API rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run trend weekly --notify

      - name: Save seen-item state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.db
          key: trend-state-${{ github.run_id }}

      - name: Commit digest
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
            exit 0
          fi
          git commit -m "digest: $(date -u +%G-W%V)"
          git push

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest
          path: digests/
          if-no-files-found: warn

      # Degraded mode publishes a plainer digest instead of failing, which is
      # the right call for readers but leaves the run green, and a green run is
      # how several weeks of unsummarized issues went unnoticed. Fail here, after
      # the digest is committed and uploaded, so the issue still goes out and the
      # repository owner still gets a failed-run email.
      - name: Fail if no LLM summarized the digest
        if: ${{ steps.digest.outcome == 'success' && steps.digest.outputs.llm_provider == '' }}
        run: |
          msg="No LLM provider answered; this week's digest is headlines and excerpts only. See the 'llm:' warnings in the Generate digest step."
          echo "::error title=Digest degraded::${msg}"
          echo "### Digest degraded" >> "$GITHUB_STEP_SUMMARY"
          echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          exit 1
